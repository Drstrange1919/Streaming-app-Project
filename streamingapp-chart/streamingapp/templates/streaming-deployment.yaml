apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming
spec:
  replicas: {{ .Values.streaming.replicas }}
  selector:
    matchLabels:
      app: streaming
  template:
    metadata:
      labels:
        app: streaming
    spec:
      containers:
        - name: streaming
          image: "{{ .Values.streaming.image }}:{{ .Values.streaming.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: MONGO_URI
              value: "mongodb://mongo:27017/streamingapp"
            - name: JWT_SECRET
              value: "streamingapp-project-jwt-secret"
---
apiVersion: v1
kind: Service
metadata:
  name: streaming
spec:
  selector:
    app: streaming
  ports:
    - port: 3002
      targetPort: 3002
  type: ClusterIP
